[foundry]
src = "contracts"
out = "out"
libs = ["lib"]
remappings = [
    "@aave/core-v3/=lib/aave-core-v3/contracts/",
    "@aave/contracts/=lib/aave-core-v3/contracts/",
    "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/"
]

[solc]
optimizer = true
optimizer_runs = 200
solc_version = "0.8.20"
evm_version = "paris"

[test]
fuzz = { runs = 10000 }
invariant = { runs = 1000, depth = 15 }

[fmt]
line_length = 120
tab_width = 4
bracket_spacing = true
